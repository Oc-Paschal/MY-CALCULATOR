<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My calculator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="calculator">
      <input id="display" disabled value="0" />
      <!-- <div class="display" id="display">0</div> -->

      <div class="buttons">
        <button class="Btn" id="operator" onclick="appendValue('+')">+</button>
        <button class="Btn" id="operator" onclick="appendValue('-')">-</button>
        <button class="Btn" id="operator" onclick="appendValue('*')">*</button>
        <button class="Btn" id="operator" onclick="appendValue('/')">/</button>

        <button class="Btn" onclick="appendValue('7')">7</button>
        <button class="Btn" onclick="appendValue('8')">8</button>
        <button class="Btn" onclick="appendValue('9')">9</button>

        <button class="Btn" onclick="appendValue('4')">4</button>
        <button class="Btn" onclick="appendValue('5')">5</button>
        <button class="Btn" onclick="appendValue('6')">6</button>

        <button class="Btn" onclick="appendValue('1')">1</button>
        <button class="Btn" onclick="appendValue('2')">2</button>
        <button class="Btn" onclick="appendValue('3')">3</button>
        <button class="Btn" onclick="appendValue('00')">00</button>

        <button class="Btn" onclick="appendValue('0')">0</button>
        <button class="Btn" onclick="appendValue('.')">.</button>
        <button class="Btn" id="operator" onclick="clearDisplay('AC')">
          AC
        </button>
        <button   class="Btn" id="operator" onclick="deleteLast('DE')">DE</button>
        <button style="grid-column: span 2;" class="Btn" id="operator" onclick="calculate('=')">=</button>
      </div>
      <p class="signature">Created by Oc Paschal</p>
    </div>

    <script src="script.js"></script>
  </body>
</html>
